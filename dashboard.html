<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Student Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard-container">
    <div class="header">
      <h2>Student Management System</h2>
      <button-a id="logoutBtn">Logout</button-a>
    </div>

    <h3>Add Student</h3>
    <form id="studentForm">
      <input type="text" id="studentName" placeholder="Student Name" required>
      <input type="text" id="studentRoll" placeholder="Roll No" required>
      <input type="tel" id="studentPhone" placeholder="Phone Number" pattern="[0-9]{10}" required>
      <input type="email" id="studentEmail" placeholder="Email" required>
      <button type="submit">Add Student</button>
    </form>

    <h3>Student List</h3>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Roll No</th>
          <th>Phone</th>
          <th>Email</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="studentTable"></tbody>
    </table>
  </div>
  <script src="script.js"></script>
</body>
</html>
